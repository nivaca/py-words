# The Flatpak of py-words.  tools/bundle-flatpak.py builds it from this
# folder (the py-words source below is then the working tree, as the zip
# has it) into dist/py-words-v.VERSION.flatpak, and with --flathub writes
# the manifest for Flathub, from the release's tag.
#
# The runtime's Python has no Tk, so Tcl, Tk and Python's tkinter (the
# _tkinter module of the same CPython, and its Lib/tkinter) are built
# here.  Tk speaks only X11 (on Wayland, through Xwayland).

app-id: io.github.nivaca.PyWords
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: py-words
finish-args:
  - --share=ipc
  - --socket=x11
  # "py-words web": the browser, outside, reaches the program's own web
  # server on this computer
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.sh
  - /share/man
  - /man

modules:
  - name: tcl
    subdir: unix
    config-opts:
      - --disable-static
    post-install:
      - chmod u+w /app/lib/libtcl*.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl9.0.4-src.tar.gz
        sha256: d0aed49230bc02a65c1e0229e65f34590a4b037ec40d546f32573b467f7551ea
        x-checker-data:
          type: html
          url: https://www.tcl-lang.org/software/tcltk/download.html
          version-pattern: tcl(9\.0\.\d+)-src\.tar\.gz
          url-template: https://prdownloads.sourceforge.net/tcl/tcl$version-src.tar.gz
      # (without its bundled packages, sqlite, tdbc, itcl and thread,
      # which Tk and tkinter do not need, and whose build looks for a
      # tclsh that runs here)
      - type: shell
        commands:
          - rm -rf pkgs
    cleanup:
      - /bin/tclsh*

  - name: tk
    subdir: unix
    config-opts:
      - --disable-static
      - --with-tcl=/app/lib
    post-install:
      - chmod u+w /app/lib/libtcl*tk*.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk9.0.4-src.tar.gz
        sha256: d7a146d2917eb8b5cc95276dbf0e3d03c7464d2b19c1675357857c989301dbb4
        x-checker-data:
          type: html
          url: https://www.tcl-lang.org/software/tcltk/download.html
          version-pattern: tk(9\.0\.\d+)-src\.tar\.gz
          url-template: https://prdownloads.sourceforge.net/tcl/tk$version-src.tar.gz
    cleanup:
      - /bin/wish*

  # _tkinter and Lib/tkinter of the CPython the runtime has (its version
  # must be the same as the runtime's, up to the minor one)
  - name: tkinter
    buildsystem: simple
    build-commands:
      - |
        set -e
        py=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
        inc=$(python3 -c 'import sysconfig; print(sysconfig.get_path("include"))')
        site=/app/lib/python$py/site-packages
        install -d $site
        gcc -shared -fPIC $CFLAGS -DWITH_APPINIT=1 \
            -I"$inc" -I"$inc/internal" -I/app/include \
            Modules/_tkinter.c Modules/tkappinit.c \
            -L/app/lib -ltcl9.0 -ltcl9tk9.0 $LDFLAGS \
            -o "$site/_tkinter$(python3-config --extension-suffix)"
        cp -r Lib/tkinter $site/
        rm -rf $site/tkinter/test
        python3 -m compileall -q --invalidation-mode checked-hash $site/tkinter
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.9/Python-3.14.9.tar.xz
        sha256: e02d9ac21cebda6e46435369744a92c65cc7cd8669697694122cf97ffacd1e53

  - name: py-words
    buildsystem: simple
    build-commands:
      - |
        set -e
        id=io.github.nivaca.PyWords
        dest=/app/share/py-words
        # The program: the top-level modules and what they read (data/ and
        # the icons), as in the RPM (packaging/py-words.spec)
        install -d $dest/icons/linux/icons
        for f in *.py; do
            [ "$f" = words_install.py ] || install -pm 0644 "$f" $dest/
        done
        [ ! -f COMMIT ] || install -pm 0644 COMMIT $dest/
        cp -pr data $dest/
        install -pm 0644 icons/py-words.svg icons/uniandes.svg $dest/icons/
        cp -pr icons/linux/icons/hicolor $dest/icons/linux/icons/
        # (checked by hash: in a Flatpak every file has the same date)
        python3 -m compileall -q --invalidation-mode checked-hash $dest
        install -d /app/bin
        # (here a copy of the data cannot be reached: the sandbox does not
        # see the user's folders)
        sed -e "s|@DATADIR@|$dest|" -e 's|@PYTHON@|/usr/bin/python3|' \
            -e 's|copy it somewhere and give the copy with --datadir\.|use the zip or a clone of the program.|' \
            packaging/py-words-launcher.in > /app/bin/py-words
        grep -q 'use the zip or a clone' /app/bin/py-words
        chmod 0755 /app/bin/py-words
        # The menu entries and icons, named after the application: the
        # window is the application's own entry
        install -d /app/share/applications
        for f in packaging/*.desktop; do
            name=$(basename "$f" .desktop)
            name=$id${name#py-words}
            sed -e "s|^Icon=py-words$|Icon=$id|" \
                -e 's|^Name=py-words (GUI)$|Name=py-words|' \
                "$f" > /app/share/applications/$name.desktop
            desktop-file-validate /app/share/applications/$name.desktop
        done
        for f in icons/linux/icons/hicolor/*/apps/py-words.*; do
            size=$(basename "$(dirname "$(dirname "$f")")")
            install -Dpm 0644 "$f" \
                "/app/share/icons/hicolor/$size/apps/$id.${f##*.}"
        done
        install -Dpm 0644 packaging/flatpak/$id.metainfo.xml \
            /app/share/metainfo/$id.metainfo.xml
        install -Dpm 0644 LICENCE.txt /app/share/licenses/$id/LICENCE.txt
    sources:
      # (tools/bundle-flatpak.py puts here the files of the zip; built
      # straight from this file, the working tree without what is not
      # part of the program)
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - dist
          - site
          - local-only
          - tests
