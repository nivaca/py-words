# Runs the tests of py-words with each push to main (and by hand).

name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  tests:
    # Not ubuntu-latest: on ubuntu-26.04 (latest since 2026-11-11) the
    # fonts below are not preinstalled and the runners could not reach
    # Ubuntu's mirrors to fetch them, so every build failed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # A virtual display (Xvfb), so that the tests of the windows run too
      # instead of being skipped
      - name: Virtual display
        run: sudo apt-get install -y xvfb fonts-dejavu
      # (each class of tests in a process of its own, at once, each with
      # an Xvfb of its own: tests/isolate.py)
      - name: Tests
        run: python3 tools/test.py
