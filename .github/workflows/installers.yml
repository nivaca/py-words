# Makes the installers of py-words (tools/bundle-installer.py), each on
# its own system, installs each one, tries it and removes it:
#
#   Windows   py-words-v.VERSION-windows-x64-setup.exe   (Inno Setup)
#   macOS     py-words-v.VERSION-macos-arm64.pkg, -macos-x86_64.pkg
#   Linux     py-words-v.VERSION-linux-x86_64.run
#
# With each tag that is pushed, they are added to the release of the tag,
# once tools/release.py has published it (it is waited for, never made
# here), except the one for Linux if the release
# already has it (signed by tools/release.py); run by hand ("Run workflow"), they are only
# kept as artifacts of the run.
#
# The installer for Windows of each tag is also signed with Authenticode by
# SignPath (CODE_SIGNING_POLICY.md), once the repository has the variables
# SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
# SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN; each
# request waits until it is approved on SignPath (up to four hours). Without
# them, those steps are skipped and the installer is not signed. To set it
# up once accepted: in SignPath, add the trusted build system "GitHub.com"
# and link it to the project, install the SignPath GitHub App on the
# repository, and paste packaging/signpath/artifact-configuration.xml as
# the project's artifact configuration; then add those variables and that
# secret here (Settings > Secrets and variables > Actions).

name: Installers

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write             # (to add them to the release)
  actions: read               # (SignPath fetches the installer from the artifacts of the run)

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the installer
        run: python3 tools/bundle-installer.py --system linux --arch x86_64
      - name: Install it, try it and remove it
        run: |
          run=$(ls dist/*-linux-x86_64.run)
          sh "$run" --check
          sh "$run" --yes
          root="$HOME/.local/share/py-words"
          "$root/python/bin/python3" packaging/installer/check.py "$root"
          ~/.local/bin/py-words cli --language en amicus | grep -i friend
          test -f ~/.local/share/applications/py-words.desktop
          ~/.local/bin/py-words uninstall --yes
          test ! -e "$root" && test ! -e ~/.local/bin/py-words
          # (and for everyone, as root)
          sudo sh "$run" --yes
          /usr/local/bin/py-words cli --language en amicus | grep -i friend
          sudo /opt/py-words/uninstall.sh --yes
          test ! -e /opt/py-words
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux
          path: dist/*.run

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'         # (the output of the tests goes to a pipe)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Inno Setup
        shell: pwsh
        run: |
          $found = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $found) { choco install innosetup -y --no-progress }
      - name: Build the installer
        run: python tools/bundle-installer.py --system windows
      # Firmado por SignPath, si el repositorio tiene su proyecto, y solo en una etiqueta; con otro nombre, para que
      # el artefacto sin firmar no choque con el firmado (installer-windows, que tiene el mismo archivo).
      - name: The installer to sign
        id: unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item dist\*-windows-x64-setup.exe
          $version = $setup.Name -replace '^py-words-v\.(.+)-windows-x64-setup\.exe$', '$1'
          New-Item -ItemType Directory signing | Out-Null
          Copy-Item $setup.FullName "signing\$($setup.BaseName)-unsigned.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT
      - name: Upload it for SignPath
        id: upload-unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          path: signing/*-unsigned.exe
          archive: false
      - name: Sign it with SignPath (approved by hand)
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(steps.unsigned.outputs.version) }}
      - name: Check the signature, and put the signed installer in its place
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem signed\*.exe)
          if ($signed.Count -ne 1) { throw "signed\ has $($signed.Count) files" }
          $signature = Get-AuthenticodeSignature $signed[0].FullName
          if ($signature.Status -ne 'Valid') { throw "the signature is $($signature.Status): $($signature.StatusMessage)" }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"
          Move-Item -Force $signed[0].FullName "dist\${{ steps.unsigned.outputs.name }}"
      - name: Install it, try it and remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\*-windows-x64-setup.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=terminal,path', '/LOG=install.log'
          $app = "$env:LOCALAPPDATA\Programs\py-words"
          & "$app\python\python.exe" packaging\installer\check.py $app
          if ($LASTEXITCODE) { throw 'check.py failed' }
          $out = & "$app\bin\py-words.cmd" cli --language en amicus | Out-String
          if ($out -notmatch 'friend') { throw "no friend in: $out" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\py-words"
          foreach ($kind in 'GUI', 'CLI', 'TUI', 'Web') {
            if (-not (Test-Path "$menu\py-words ($kind).lnk")) { throw "no shortcut $kind" }
          }
          if ((Get-ItemProperty HKCU:\Environment).Path -notlike "*$app\bin*") { throw 'not in the PATH' }
          if (-not ((Get-ItemProperty "$app\program\data\dictionary.xml").Attributes -band [IO.FileAttributes]::ReadOnly)) { throw 'the dictionary is not read-only' }
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # (the uninstaller goes on in a copy of itself)
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\program"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\program") { throw 'not uninstalled' }
          if ((Get-ItemProperty HKCU:\Environment).Path -like "*$app\bin*") { throw 'still in the PATH' }
      - name: The log of the installation
        if: always()
        shell: pwsh
        run: if (Test-Path install.log) { Get-Content install.log -Tail 60 }
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: dist/*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the installer
        run: python3 tools/bundle-installer.py --system macos --arch ${{ matrix.arch }}
      - name: Install it, try it and remove it
        run: |
          set -e
          sudo installer -pkg dist/*-macos-${{ matrix.arch }}.pkg -target /
          res=/Applications/py-words.app/Contents/Resources
          "$res/python/bin/python3" packaging/installer/check.py "$res"
          /usr/local/bin/py-words cli --language en amicus | grep -i friend
          test -x "/Applications/py-words (CLI).app/Contents/MacOS/py-words"
          pkgutil --pkgs | grep io.github.nivaca.py-words
          sudo /usr/local/bin/py-words uninstall --yes
          test ! -e /Applications/py-words.app && test ! -e /usr/local/bin/py-words
          ! pkgutil --pkgs | grep io.github.nivaca.py-words
      - uses: actions/upload-artifact@v7
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # tools/release.py hace la versión (con los archivos firmados) después de subir la etiqueta:
          # aquí se la espera, publicada, y nunca se hace, o las dos se harían a la vez (3.30)
          draft=""
          for i in $(seq 1 120); do
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
            [ "$draft" = false ] && break
            sleep 30
          done
          if [ "$draft" != false ]; then
            echo "There is no release of $TAG after an hour: make it with tools/release.py, then run this again."
            exit 1
          fi
          # The installer for Linux already there is kept: tools/release.py
          # made and signed it (FILE.asc, SHA256SUMS), and this build would
          # not match. Those of Windows and macOS are signed afterwards, by
          # tools/release.py --installers.
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for f in installers/*; do
            case "$f" in
              *.run) if grep -qxF "$(basename "$f")" <<< "$have"; then
                       echo "kept the signed $(basename "$f") already in the release"
                       continue
                     fi ;;
            esac
            gh release upload "$TAG" "$f" --clobber
          done
