# Publishes the site of py-words (pages/build.py: a page that sends the
# visitors to the program on its server) on GitHub Pages, with each push to
# main.
# In the repository's settings: Pages > Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Not ubuntu-latest: on ubuntu-26.04 (latest since 2026-11-11) the
    # fonts below are not preinstalled and the runners could not reach
    # Ubuntu's mirrors to fetch them, so every build failed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # A virtual display (Xvfb), so that the tests of the windows run too
      # instead of being skipped
      - name: Virtual display
        run: sudo apt-get install -y xvfb fonts-dejavu
      # (tests/isolate.py starts an Xvfb of its own for the windows)
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Build the site
        run: python3 pages/build.py -o site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
