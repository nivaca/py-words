# Publishes the site of py-words (pages/build.py: the dictionary in the
# browser, with Pyodide) on GitHub Pages, with each push to main.
# In the repository's settings: Pages > Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # El mismo Python que trae Pyodide (PYODIDE en pages/app.js)
          python-version: '3.12'      # (that of Pyodide 0.26)
      # A virtual display (Xvfb), so that the tests of the windows run too
      # instead of being skipped
      - name: Virtual display
        run: sudo apt-get install -y xvfb fonts-dejavu
      - name: Tests
        run: xvfb-run -a python3 -m unittest discover -s tests
      - name: Build the site
        run: python3 pages/build.py -o site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
