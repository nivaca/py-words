# Makes the AppImage of py-words (tools/bundle-appimage.py), for Linux.
# With each tag that is pushed, it is added to the release of the tag,
# once tools/release.py has published it (it is waited for, never made
# here), unless the release already has the one that tools/release.py made
# and signed; run by hand ("Run workflow"), it is only kept
# as an artifact of the run.

name: AppImage

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write             # (to add it to the release)

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build the AppImage
        run: python3 tools/bundle-appimage.py
      # Without a display: does the AppImage start, and find a word?
      - name: Try it
        run: |
          app=$(ls build/release/*.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$app" help
          "$app" cli --language en amicus | grep -i friend
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: build/release/*.AppImage
      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # tools/release.py hace la versión (con los archivos firmados) después de subir la etiqueta:
          # aquí se la espera, publicada, y nunca se hace, o las dos se harían a la vez (3.30)
          draft=""
          for i in $(seq 1 120); do
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
            [ "$draft" = false ] && break
            sleep 30
          done
          if [ "$draft" != false ]; then
            echo "There is no release of $TAG after an hour: make it with tools/release.py, then run this again."
            exit 1
          fi
          # A file already there is kept: tools/release.py signed it
          # (FILE.asc, SHA256SUMS), and a new build would not match
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for f in build/release/*.AppImage; do
            if grep -qxF "$(basename "$f")" <<< "$have"; then
              echo "kept the signed $(basename "$f") already in the release"
            else
              gh release upload "$TAG" "$f"
            fi
          done
