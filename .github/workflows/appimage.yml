# Makes the AppImage of py-words (tools/bundle-appimage.py), for Linux.
# With each tag that is pushed, it is added to the release of the tag
# (made if there is none); run by hand ("Run workflow"), it is only kept
# as an artifact of the run.

name: AppImage

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write             # (to add it to the release)

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the AppImage
        run: python3 tools/bundle-appimage.py
      # Without a display: does the AppImage start, and find a word?
      - name: Try it
        run: |
          app=$(ls dist/*.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$app" help
          "$app" cli --language en amicus | grep -i friend
      - uses: actions/upload-artifact@v5
        with:
          name: appimage
          path: dist/*.AppImage
      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.AppImage --clobber
